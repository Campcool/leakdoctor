name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Brand fact + structural validation (validate-site.mjs)
        run: node scripts/validate-site.mjs
      - name: Per-page Open Graph images and metadata
        run: node --test scripts/test-og-contract.mjs
      - name: Homepage pricing and LINE handoff contract
        run: node --test scripts/test-home-service-hub.mjs
      - name: Six-service header, bottom spacing and official LINE asset
        run: node --test scripts/test-header-contract.mjs
      - name: Editorial process, safety copy and layout regression guards
        run: node --test scripts/test-process-editorial.mjs
      - name: 防假綠：故意破壞 header.js 常數，確認 validate 能抓住
        run: |
          cp header.js header.js.bak
          node -e "const fs=require('fs'); const s=fs.readFileSync('header.js','utf8'); fs.writeFileSync('header.js', s.replace(\"G-1H1X1X9QZE\", 'G-XXXXXXXXXX').replace(\"lin.ee/WVxmY65\", 'lin.ee/FAKE123'));"
          node scripts/validate-site.mjs && { echo "::error::validate 未抓住破壞的常數（防假綠失敗）"; exit 1; } || echo "validate 成功抓住常數破壞"
          mv header.js.bak header.js
          node scripts/validate-site.mjs || exit 1
      - name: og-image.html 工具頁維持 noindex
        run: grep -q 'noindex' og-image.html
      - name: llms.txt 常數一致性
        run: |
          grep -q 'lin.ee/WVxmY65' llms.txt && grep -q '@478xvlgl' llms.txt && echo "llms.txt LINE 資訊一致"
      - name: Pages artifact excludes internal docs
        run: bash scripts/prepare-pages-artifact.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare public artifact
        run: bash scripts/prepare-pages-artifact.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
